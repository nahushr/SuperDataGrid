name: Build, analyze, and publish SuperDataGrid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superdatagrid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Build the Vite example
        run: npm run build:example

      - name: Verify package contents
        run: npm pack --dry-run

  analyze:
    name: SonarCloud and Snyk analysis
    needs: build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Check out source with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require SonarCloud credentials for trusted builds
        if: env.HAS_SONAR_TOKEN != 'true'
        run: |
          echo "::error::SONAR_TOKEN is required to enforce the SonarCloud quality gate."
          exit 1

      - name: Run unit tests
        run: npm test

      - name: Run SonarCloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx --yes sonarqube-scanner@5.0.0 -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600

      - name: Fail when SonarCloud reports open issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          issue_scope=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            issue_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          else
            issue_scope+=(--data-urlencode "branch=$GITHUB_REF_NAME")
          fi

          response="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode 'componentKeys=nahushr_SuperDataGrid' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=500' \
            "${issue_scope[@]}" \
            'https://sonarcloud.io/api/issues/search')"
          issue_total="$(jq --raw-output '.total' <<< "$response")"

          if [[ "$issue_total" != "0" ]]; then
            echo "::error::SonarCloud reported $issue_total unresolved issue(s)."
            jq --raw-output '.issues[] | "\(.severity) \(.type) \(.component) line \(.line // 0): \(.message)"' <<< "$response"
            exit 1
          fi

          echo "SonarCloud reports zero unresolved issues."

      - name: Set up Snyk CLI
        if: env.HAS_SNYK_TOKEN == 'true'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      - name: Run Snyk dependency analysis
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

      - name: Run Snyk Code analysis
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Note missing Snyk secret
        if: env.HAS_SNYK_TOKEN != 'true'
        run: echo "::notice::Snyk analysis skipped because SNYK_TOKEN is not configured."

  publish:
    name: Publish to npm
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up npm registry authentication
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package for publishing
        run: npm run build

      - name: Check whether this package version is already published
        id: published-version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_manifest="$(mktemp)"
          package_url="https://unpkg.com/${package_name}@${package_version}/package.json"
          if npm view "${package_name}@${package_version}" version --json --prefer-online --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping duplicate publish."
          elif curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --max-time 30 "$package_url" --output "$package_manifest" && node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(pkg.name === process.argv[2] && pkg.version === process.argv[3] ? 0 : 1)' "$package_manifest" "$package_name" "$package_version"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is live on npm's CDN; skipping duplicate publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is not published; publishing this version."
          fi

      - name: Verify npm publishing identity
        if: steps.published-version.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Publish public npm package
        if: steps.published-version.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --registry=https://registry.npmjs.org
